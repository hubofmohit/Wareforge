[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Runs scheduled-backup.js once a day, snapshotting every active
# tenant's data into the `backups` table. Scheduled Functions require
# a Netlify plan that supports them — check your dashboard's Functions
# tab after deploying to confirm it actually registered as scheduled
# rather than just a regular callable function.
[functions."scheduled-backup"]
  schedule = "@daily"

# Netlify handles Stripe's raw webhook body correctly by default for
# Node functions — no special config needed beyond pointing at the
# functions directory above.